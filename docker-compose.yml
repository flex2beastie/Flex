services:
  we-the-people-library:
    build: .
    image: we-the-people-library:latest
    container_name: we-the-people-library
    restart: unless-stopped
    ports:
      - "8088:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
